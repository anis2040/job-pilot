      <!-- Contact -->
      <div class="profile-section">
        <h3>Contact</h3>
        <div class="field-row cols-2">
          <div class="field"><label>Full Name *</label><input id="p-name" placeholder="Jane Smith"></div>
          <div class="field"><label>City, State</label><input id="p-location" placeholder="Chicago, IL"></div>
        </div>
        <div class="field-row cols-2">
          <div class="field"><label>Email *</label><input id="p-email" type="email" placeholder="jane@example.com"></div>
          <div class="field"><label>Phone</label><input id="p-phone" placeholder="+1 312-555-0000"></div>
        </div>
        <div class="field-row cols-2">
          <div class="field"><label>LinkedIn URL</label><input id="p-linkedin" placeholder="https://linkedin.com/in/..."></div>
          <div class="field"><label>Work Authorization</label>
            <select id="p-auth">
              <option value="">Select…</option>
              <option value="US Citizen — no sponsorship required">US Citizen</option>
              <option value="Green Card holder — legally authorized to work in the U.S.">Green Card</option>
              <option value="Requires H-1B sponsorship">Requires H-1B sponsorship</option>
              <option value="Authorized to work in the US · No sponsorship required">Other — authorized, no sponsorship</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div class="profile-section">
        <h3>Professional Summary</h3>
        <div class="field"><textarea id="p-summary" style="min-height:80px" placeholder="2–3 sentences: what you do, for whom, and what makes you effective."></textarea></div>
      </div>

      <!-- Competencies -->
      <div class="profile-section">
        <h3>Core Competencies</h3>
        <p style="font-size:0.76rem;color:#64748b;margin-bottom:8px">Skills and methodologies to highlight (6–12 items).</p>
        <div class="dynamic-list" id="competencies-list"></div>
        <button class="btn-add-row" onclick="addRow('competencies-list','competency-row','Add a competency…')">+ Add competency</button>
      </div>

      <!-- Experience -->
      <div class="profile-section">
        <h3>Professional Experience</h3>
        <div id="exp-list"></div>
        <button class="btn-add-row" onclick="addExpBlock()">+ Add role</button>
      </div>

      <!-- Education -->
      <div class="profile-section">
        <h3>Education</h3>
        <div id="edu-list"></div>
        <button class="btn-add-row" onclick="addEduRow()">+ Add degree</button>
      </div>

      <!-- Certifications -->
      <div class="profile-section">
        <h3>Certifications <span style="font-weight:400;color:#475569;font-size:0.75rem">(optional)</span></h3>
        <div class="dynamic-list" id="certs-list"></div>
        <button class="btn-add-row" onclick="addRow('certs-list','cert-row','e.g. Professional Scrum Product Owner I (PSPO I), Scrum.org')">+ Add certification</button>
      </div>
