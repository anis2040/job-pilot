<div class="autofill-bar">
  <label class="autofill-label">
    <span>⚡ Autofill from resume</span>
    <input type="file" id="resume-upload" accept=".pdf,.docx,.txt" onchange="autofillFromResume(this)">
    <span class="autofill-btn">Upload PDF / DOCX</span>
  </label>
  <span id="autofill-status"></span>
</div>
