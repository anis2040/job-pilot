<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}JobPilot AI{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/base.css">
{% block styles %}{% endblock %}
<style>
  .skip-link { position: absolute; left: -9999px; top: 4px; background: var(--blue); color: #fff; padding: 6px 14px; border-radius: var(--radius); font-size: var(--text-base); font-weight: 600; z-index: var(--z-skiplink); }
  .skip-link:focus { left: 4px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<main id="main-content">{% block body %}{% endblock %}</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/ui.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
