{% extends "base.html" %}
{% block title %}Job Scraper — Manage Profiles{% endblock %}

{% block styles %}
<style>
  body { padding: var(--space-8) var(--space-4); }
  .wrap { width: 600px; max-width: 100%; margin: 0 auto; }
  .page-header { margin-bottom: var(--space-6); }
  .card { border-radius: var(--radius-lg); padding: var(--space-6); }
  .profile-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: var(--space-2); transition: background .1s; }
  .profile-row:hover { background: #141824; border-color: var(--blue); }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; color: var(--text); font-size: 0.9rem; }
  .info .path { font-size: var(--text-xs); color: var(--text-faint); margin-top: 1px; }
  .footer { margin-top: var(--space-5); display: flex; gap: 10px; }
</style>
{% endblock %}

{% block body %}
<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">Manage Profiles</h1>
    <p class="page-desc">Switch between profiles or delete ones you no longer need.</p>
  </div>
  <div class="card">
    <div id="list"></div>
    <div class="footer">
      <button class="btn btn-primary" onclick="addNewProfile()">+ Add New Profile</button>
      <a href="/" class="btn btn-ghost">← Back to Jobs</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function load() {
  const res = await fetch("/api/profiles");
  const { profiles, active_slug } = await res.json();
  const list = document.getElementById("list");
  if (!profiles.length) {
    list.innerHTML = '<p class="text-muted" style="padding:8px">No profiles yet.</p>';
    return;
  }
  list.innerHTML = profiles.map(p => `
    <div class="profile-row" onclick="window.location='/profile-settings/${p.slug}'" style="cursor:pointer">
      <div class="avatar" style="background:${p.color}">${escapeHtml(p.initials)}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="path">profiles/${escapeHtml(p.slug)}/</div>
      </div>
      ${p.slug === active_slug ? '<span class="badge-active">Active</span>' : `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();switchTo('${p.slug}')">Switch</button>`}
      <button class="btn btn-sm btn-danger-outline" data-slug="${escapeHtml(p.slug)}" data-name="${escapeHtml(p.name)}" onclick="event.stopPropagation();del(this.dataset.slug, this.dataset.name)" ${p.slug === active_slug ? 'disabled title="Switch away before deleting"' : ''}>Delete</button>
    </div>`).join("");
}

async function switchTo(slug) {
  await fetch(`/api/profiles/switch/${slug}`, { method: "POST" });
  window.location.href = "/";
}

async function del(slug, name) {
  if (!confirm(`Delete "${name}" and all its job data? This cannot be undone.`)) return;
  const data = await apiPost(`/api/profiles/delete/${slug}`, {});
  if (data.error) alert(data.error);
  else load();
}

load();
</script>
{% endblock %}
