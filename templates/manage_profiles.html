<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scraper — Manage Profiles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { -webkit-appearance: none; appearance: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; padding: 32px 16px; }
  .wrap { width: 600px; max-width: 100%; margin: 0 auto; }
  .header { margin-bottom: 24px; }
  .header h1 { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .header p { color: #64748b; font-size: 0.84rem; }
  .card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 24px; }
  .profile-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; margin-bottom: 8px; transition: background .1s; }
  .profile-row:hover { background: #141824; border-color: #3b82f6; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #fff; flex-shrink: 0; }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; color: #e2e8f0; font-size: 0.9rem; }
  .info .path { font-size: 0.72rem; color: #475569; margin-top: 1px; }
  .badge-active { background: #14532d; color: #4ade80; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .btn { padding: 5px 12px; border-radius: 5px; font-size: 0.76rem; font-weight: 600; border: none; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-ghost { background: #1e2333; color: #94a3b8; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-danger { background: none; border: 1px solid #7f1d1d; color: #f87171; }
  .btn-danger:hover { background: #2d1b1b; }
  .footer { margin-top: 20px; display: flex; gap: 10px; }
  a.btn { text-decoration: none; display: inline-flex; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Manage Profiles</h1>
    <p>Switch between profiles or delete ones you no longer need.</p>
  </div>
  <div class="card">
    <div id="list"></div>
    <div class="footer">
      <button class="btn btn-primary" onclick="addNewProfile()">+ Add New Profile</button>
      <a href="/" class="btn btn-ghost">← Back to Jobs</a>
    </div>
  </div>
</div>
<script>
// Escape untrusted strings before interpolating into innerHTML.
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

async function addNewProfile() {
  const res = await fetch("/api/profiles/new", { method: "POST" });
  const data = await res.json();
  if (data.ok) window.location.href = "/setup";
}

async function load() {
  const res = await fetch("/api/profiles");
  const { profiles, active_slug } = await res.json();
  const list = document.getElementById("list");
  if (!profiles.length) {
    list.innerHTML = '<p style="color:#64748b;padding:8px">No profiles yet.</p>';
    return;
  }
  list.innerHTML = profiles.map(p => `
    <div class="profile-row" onclick="window.location='/profile-settings/${p.slug}'" style="cursor:pointer">
      <div class="avatar" style="background:${p.color}">${escapeHtml(p.initials)}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="path">profiles/${escapeHtml(p.slug)}/</div>
      </div>
      ${p.slug === active_slug ? '<span class="badge-active">Active</span>' : `<button class="btn btn-ghost" onclick="event.stopPropagation();switchTo('${p.slug}')">Switch</button>`}
      <button class="btn btn-danger" data-slug="${escapeHtml(p.slug)}" data-name="${escapeHtml(p.name)}" onclick="event.stopPropagation();del(this.dataset.slug, this.dataset.name)" ${p.slug === active_slug ? 'disabled title="Switch away before deleting"' : ''}>Delete</button>
    </div>`).join("");
}

async function switchTo(slug) {
  await fetch(`/api/profiles/switch/${slug}`, { method: "POST" });
  window.location.href = "/";
}

async function del(slug, name) {
  if (!confirm(`Delete "${name}" and all its job data? This cannot be undone.`)) return;
  const res = await fetch(`/api/profiles/delete/${slug}`, { method: "POST" });
  const data = await res.json();
  if (data.error) alert(data.error);
  else load();
}

load();
</script>
</body>
</html>
