{% extends "base.html" %}
{% block title %}JobPilot AI — Manage Profiles{% endblock %}

{% block styles %}
<style>
  body { padding: var(--space-8) var(--space-4); }
  .wrap { width: 600px; max-width: 100%; margin: 0 auto; }
  .page-header { margin-bottom: var(--space-6); }
  .card { border-radius: var(--radius-lg); padding: var(--space-6); }
  .profile-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--bg-page); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: var(--space-2); transition: background var(--dur-fast) var(--ease-standard); }
  .profile-row:hover { background: var(--bg-hover); border-color: var(--blue); }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; color: var(--text); font-size: 0.9rem; }
  .info .path { font-size: var(--text-xs); color: var(--text-faint); margin-top: 1px; }
  .footer { margin-top: var(--space-5); display: flex; gap: 10px; }
</style>
{% endblock %}

{% block body %}
<div class="wrap">
  <div class="page-header">
    <h1 class="page-title">Manage Profiles</h1>
    <p class="page-desc">Switch between profiles or delete ones you no longer need.</p>
  </div>
  <div class="card">
    <div id="list"></div>
    <div class="footer">
      <button class="btn btn-primary" onclick="addNewProfile()">+ Add New Profile</button>
      <a href="/" class="btn btn-ghost">← Back to Jobs</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function load() {
  const res = await fetch("/api/profiles");
  const { profiles, active_slug } = await res.json();
  const list = document.getElementById("list");
  if (!profiles.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">👤</div>
      <div class="empty-state-title">No profiles yet</div>
      <div class="empty-state-desc">Create your first profile to start tracking jobs and generating tailored resumes.</div>
      <button class="btn btn-primary" onclick="addNewProfile()" style="margin-top:var(--space-2)">+ Add profile</button>
    </div>`;
    return;
  }
  list.innerHTML = profiles.map(p => `
    <div class="profile-row" onclick="window.location='/profile-settings/${p.slug}'" style="cursor:pointer">
      <div class="avatar" style="background:${p.color}">${escapeHtml(p.initials)}</div>
      <div class="info">
        <div class="name">${escapeHtml(p.label)}</div>
        <div class="path">${p.label !== p.name ? escapeHtml(p.name) + " · " : ""}profiles/${escapeHtml(p.slug)}/</div>
      </div>
      ${p.slug === active_slug ? '<span class="badge-active">Active</span>' : `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();switchTo('${p.slug}')">Switch</button>`}
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();rename('${p.slug}', ${JSON.stringify(p.label)})">Rename</button>
      <button class="btn btn-sm btn-danger-outline" data-slug="${escapeHtml(p.slug)}" data-name="${escapeHtml(p.label)}" onclick="event.stopPropagation();del(this.dataset.slug, this.dataset.name)" ${p.slug === active_slug ? 'disabled title="Switch away before deleting"' : ''}>Delete</button>
    </div>`).join("");
}

async function rename(slug, currentLabel) {
  const label = await promptDialog({
    title: "Rename profile",
    message: "Set a display label for this profile. This is just a label — the profile's internal ID and files are unchanged.",
    value: currentLabel,
    placeholder: "e.g. Backend roles, US applications",
    confirmLabel: "Save",
  });
  if (label === null) return;   // cancelled
  const data = await apiPost(`/api/profiles/${slug}/label`, { label });
  if (data.ok) { showToast("✓ Profile renamed"); load(); }
  else showToast(data.error || "Rename failed", "err");
}

async function switchTo(slug) {
  await fetch(`/api/profiles/switch/${slug}`, { method: "POST" });
  window.location.href = "/";
}

async function del(slug, name) {
  const ok = await confirmDialog({
    title: "Delete profile?",
    message: `"${name}" and all its job data will be permanently removed. This cannot be undone.`,
    confirmLabel: "Delete",
    danger: true,
  });
  if (!ok) return;
  const data = await apiPost(`/api/profiles/delete/${slug}`, {});
  if (data.error) showToast(data.error, "err");
  else load();
}

load();
</script>
{% endblock %}
