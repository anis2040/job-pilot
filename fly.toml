# fly.toml app configuration file generated for job-scraper-moonlit-willow-9439 on 2026-08-06T23:57:32-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'job-scraper-moonlit-willow-9439'
primary_region = 'ord'

[build]

[env]
  FLASK_DEBUG = 'false'
  AUTH_DISABLED = '0'
  PORT = '5050'
  PDFLATEX_LIMIT = '2'
  GUNICORN_THREADS = '8'

[[mounts]]
  source = 'profiles'
  destination = '/app/profiles'

[http_service]
  internal_port = 5050
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
